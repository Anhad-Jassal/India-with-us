kind = "web"
previewPath = "/"
title = "India With Us"
description = "A full-stack India travel marketplace where visitors discover destinations, buy curated tours, and build personalized trips, with customer accounts and protected admin management."
version = "1.0.0"
id = "artifacts/india-with-us"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23251

[services.development]
run = "pnpm --filter @workspace/india-with-us run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/india-with-us", "run", "build" ]
serve = "static"
publicDir = "artifacts/india-with-us/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23251"
BASE_PATH = "/"
